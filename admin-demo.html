<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة لوحة امتحان النجاح</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f8ff;color:#17213a}.hidden{display:none!important}.card{background:#fff;border:1px solid #dfe7f5;border-radius:16px;padding:16px;box-shadow:0 5px 18px #102a720d}.primary,.soft,.danger{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}.primary{background:#102a72;color:#fff}.soft{background:#eef3ff;color:#102a72}.danger{background:#ffe8e8;color:#b3261e}.muted{color:#71809b}.login{min-height:100vh;display:grid;place-items:center}.login .card{width:min(410px,92%);text-align:center}.logo{width:62px;height:62px;border-radius:18px;background:#102a72;color:#fff;display:grid;place-items:center;margin:auto;font-size:28px}.field{display:block;margin:12px 0}.field span{display:block;font-weight:bold;margin-bottom:6px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #ccd7eb;border-radius:10px;font:inherit}.top{background:white;padding:14px 18px;border-bottom:1px solid #dfe7f5;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;color:#102a72}.layout{max-width:1250px;margin:auto;padding:16px;display:grid;grid-template-columns:220px 1fr;gap:14px}.nav{background:white;border:1px solid #dfe7f5;border-radius:14px;padding:8px;height:max-content}.nav button{display:block;width:100%;text-align:right;padding:12px;border:0;background:white;border-radius:9px;font-weight:bold;color:#24324d}.nav button.active{background:#102a72;color:white}.title h2{color:#102a72;margin:4px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.big{font-size:28px;font-weight:900;color:#102a72}.notice{background:#fff8d9;border:1px solid #efdf91;padding:12px;border-radius:12px;margin:12px 0;line-height:1.8}.cms{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}.site{background:#fff;border:1px solid #dfe7f5;border-radius:14px;padding:18px;min-height:500px}.hero{background:#102a72;color:#fff;border-radius:14px;padding:25px;margin:12px 0}.pickable{outline:2px dashed transparent;cursor:pointer;padding:5px;border-radius:6px}.pickmode .pickable:hover{outline-color:#e5a000;background:#fff4d5;color:#17213a}.panel{position:sticky;top:12px;height:max-content}.hint{background:#eef8ff;padding:12px;border-radius:10px;line-height:1.7}.saved{padding:9px;border:1px solid #dfe7f5;border-radius:9px;margin:7px 0;font-size:13px}.status{color:#147d4b;font-weight:bold;min-height:24px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.section{margin-top:14px}@media(max-width:800px){.layout{display:block}.nav{display:flex;overflow:auto;margin-bottom:12px}.nav button{white-space:nowrap;width:auto}.cards,.cms{grid-template-columns:1fr}.panel{position:static}.top{gap:8px;flex-wrap:wrap}}
</style></head><body>
<div id="login" class="login"><div class="card"><div class="logo">✓</div><h1 style="color:#102a72">امتحان النجاح</h1><p class="muted">معاينة تجريبية للوحة الإدارة</p><label class="field"><span>رمز الدخول التجريبي</span><input id="pass" type="password" placeholder="اكتبي demo"></label><button class="primary" id="enter" style="width:100%">دخول المعاينة</button><p class="muted">رمز هذه المعاينة: demo</p></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand">امتحان النجاح – لوحة الإدارة (نسخة تجريبية)</div><button class="soft" id="logout">خروج</button></header><div class="layout"><nav class="nav" id="nav"><button class="active" data-page="home">الرئيسية</button><button data-page="content">المحتوى والصور</button><button data-page="sections">أقسام الموقع</button><button data-page="orders">الطلبات</button><button data-page="exams">الامتحانات</button><button data-page="stats">الإحصاءات</button><button data-page="editor">محرر الموقع الكامل</button><button data-page="settings">الإعدادات</button></nav><main id="main"></main></div></div>
<script>
const $=s=>document.querySelector(s);let page='home',selected=null,items=JSON.parse(localStorage.getItem('demoCmsItems')||'[]'),title=localStorage.getItem('demoCmsTitle')||'طريقك إلى النجاح يبدأ من هنا';
$('#enter').onclick=()=>{if($('#pass').value.trim()==='demo'){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render('home')}else alert('رمز المعاينة هو demo')};$('#pass').onkeydown=e=>{if(e.key==='Enter')$('#enter').click()};$('#logout').onclick=()=>location.reload();
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.page)};
function render(p){page=p;let c=$('#main');if(p==='home'){c.innerHTML='<div class="title"><h2>الرئيسية</h2><p class="muted">إدارة موقع امتحان النجاح من مكان واحد.</p></div><div class="cards"><div class="card"><b>الطلبات</b><div class="big">12</div><span class="muted">بيانات توضيحية</span></div><div class="card"><b>الأقسام</b><div class="big">6</div></div><div class="card"><b>الامتحانات</b><div class="big">24</div></div></div><div class="card section"><h3>هذه نسخة عرض فقط</h3><p class="muted">كل الأرقام والبيانات تجريبية. لا يوجد اتصال بالموقع أو بقاعدة بياناته.</p></div>'}
if(p==='content'){
let packages=JSON.parse(localStorage.getItem('demoCmsPackages')||'null')||[{name:'العادية',price:'3.5',description:'الباقة العادية'},{name:'التوفير',price:'4.5',description:'الباقة الاقتصادية'},{name:'السوبر',price:'5.5',description:'الباقة الشاملة'}];
let heroImage=localStorage.getItem('demoCmsHeroImage')||'';
c.innerHTML='<div class="title"><h2>المحتوى والصور</h2><p class="muted">عدّلي المحتوى والصورة والباقات، ثم احفظي كل قسم بشكل مستقل.</p></div>'+
'<div class="card"><h3>محتوى الواجهة</h3><label class="field"><span>العنوان الرئيسي</span><input id="ct"></label><label class="field"><span>وصف الواجهة</span><textarea id="desc" rows="3"></textarea></label><label class="field"><span>عنوان قسم طلب الامتحانات</span><input id="orderTitle" type="text" placeholder="اكتب عنوان القسم"></label><label class="field"><span>صورة الواجهة</span><input id="heroFile" type="file" accept="image/*"><small class="muted">اختاري صورة من الهاتف لمعاينتها في هذه النسخة التجريبية.</small></label><div id="imagePreview" class="section"></div><div class="row section"><button class="primary" id="saveContent">حفظ المحتوى والصورة</button><button class="soft" id="removeImage">حذف الصورة</button></div><p class="status" id="contentStatus"></p></div>'+
'<div class="card section"><h3>الباقات والأسعار</h3><p class="muted">عدّلي الاسم والسعر والوصف، أو أضيفي باقة واحذفيها وغيّري ترتيبها.</p><div id="packageList"></div><div class="row section"><button class="soft" id="addPackage">+ إضافة باقة</button><button class="primary" id="savePackages">حفظ الباقات والأسعار</button></div><p class="status" id="packageStatus"></p></div>';
$('#ct').value=title;$('#desc').value=localStorage.getItem('demoCmsDesc')||'تدرب، اختبر نفسك، واعرف مستواك.';$('#orderTitle').value=localStorage.getItem('demoCmsOrderTitle')||'طلب الامتحانات';
function showImage(){const box=$('#imagePreview');box.innerHTML=heroImage?'<img alt="معاينة صورة الواجهة" src="'+heroImage+'" style="max-width:100%;max-height:220px;border-radius:12px;border:1px solid #dfe7f5">':'<div class="hint">لم يتم اختيار صورة بعد.</div>'}showImage();
$('#heroFile').onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('يرجى اختيار ملف صورة.');e.target.value='';return}if(file.size>1500000){alert('حجم الصورة في المعاينة يجب ألا يتجاوز 1.5 ميجابايت.');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{heroImage=reader.result;showImage();$('#contentStatus').textContent='تم اختيار الصورة. اضغطي حفظ لتخزينها في هذه المعاينة.'};reader.readAsDataURL(file)};
$('#removeImage').onclick=()=>{heroImage='';$('#heroFile').value='';showImage();$('#contentStatus').textContent='تمت إزالة الصورة من المعاينة؛ احفظي لتأكيد التغيير.'};
$('#saveContent').onclick=()=>{title=$('#ct').value;localStorage.setItem('demoCmsTitle',title);localStorage.setItem('demoCmsDesc',$('#desc').value);localStorage.setItem('demoCmsOrderTitle',$('#orderTitle').value);if(heroImage)localStorage.setItem('demoCmsHeroImage',heroImage);else localStorage.removeItem('demoCmsHeroImage');$('#contentStatus').textContent='تم حفظ المحتوى والصورة محليًا في المعاينة فقط.'};
function drawPackages(){$('#packageList').innerHTML=packages.map((x,i)=>'<div class="saved"><div class="row"><b>الباقة '+(i+1)+'</b><button class="soft" data-up="'+i+'" '+(i===0?'disabled':'')+'>↑ للأعلى</button><button class="soft" data-down="'+i+'" '+(i===packages.length-1?'disabled':'')+'>↓ للأسفل</button><button class="danger" data-remove="'+i+'">حذف</button></div><label class="field"><span>اسم الباقة</span><input data-name="'+i+'" value="'+escapeHtml(x.name)+'"></label><label class="field"><span>السعر بالدينار</span><input data-price="'+i+'" type="number" min="0" step="0.1" value="'+escapeHtml(x.price)+'"></label><label class="field"><span>الوصف والمميزات</span><textarea data-desc="'+i+'" rows="2">'+escapeHtml(x.description)+'</textarea></label></div>').join('')}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
drawPackages();
$('#packageList').onclick=e=>{let up=e.target.dataset.up,down=e.target.dataset.down,remove=e.target.dataset.remove;if(remove!==undefined){packages.splice(Number(remove),1);drawPackages()}else if(up!==undefined){let i=Number(up);[packages[i-1],packages[i]]=[packages[i],packages[i-1]];drawPackages()}else if(down!==undefined){let i=Number(down);[packages[i+1],packages[i]]=[packages[i],packages[i+1]];drawPackages()}};
$('#addPackage').onclick=()=>{packages.push({name:'باقة جديدة',price:'0',description:''});drawPackages()};
$('#savePackages').onclick=()=>{packages=packages.map((x,i)=>({name:$('#packageList [data-name="'+i+'"]').value,price:$('#packageList [data-price="'+i+'"]').value,description:$('#packageList [data-desc="'+i+'"]').value}));localStorage.setItem('demoCmsPackages',JSON.stringify(packages));$('#packageStatus').textContent='تم حفظ الباقات والأسعار محليًا في المعاينة فقط.'}
}
if(p==='sections'){
const defaults=[
{name:'الأول الثانوي – توجيهي (2010)',visible:true,materials:[]},
{name:'الثاني الثانوي – توجيهي (2009)',visible:true,materials:[]},
{name:'BETC بيتك (2009)',visible:true,materials:[]},
{name:'الأول الثانوي (تكميلي)',visible:true,materials:[]},
{name:'الثاني الثانوي (تكميلي – منهاج جديد)',visible:true,materials:[]},
{name:'BETC بيتك (تكميلي)',visible:true,materials:[]}
];
let groups=JSON.parse(localStorage.getItem('demoCmsStudyGroups')||'null')||defaults;
let basicGrades=JSON.parse(localStorage.getItem('demoCmsBasicGrades')||'null')||Array.from({length:10},(_,i)=>({name:'الصف '+['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'][i],visible:true}));
let activeGroup=0;
c.innerHTML='<div class="title"><h2>إدارة الصفوف والمواد</h2><p class="muted">تبقى الصفوف كلها معًا في الموقع الرسمي، ولكل واحد من الأقسام الستة قائمة مواد منسدلة مستقلة.</p></div>'+
'<div class="card"><h3>الصفوف من الأول إلى العاشر</h3><p class="muted">هذه الصفوف تظهر للاختيار في الموقع، وتُدار كباقات فقط دون قوائم مواد.</p><div id="basicGradesList"></div><div class="row section"><button class="primary" id="saveBasicGrades">حفظ الصفوف 1–10</button></div><p class="status" id="basicGradesStatus"></p></div>'+
'<div class="card section"><h3>أقسام التوجيهي والمواد الستة</h3><p class="muted">اختاري القسم لإدارة مواده. التعديلات هنا تجريبية ومحفوظة على هذا الجهاز فقط.</p><div id="studyGroups"></div><div class="row section"><button class="soft" id="addStudyGroup">+ إضافة قسم توجيهي</button><button class="primary" id="saveGroups">حفظ الأقسام والمواد</button></div><p class="status" id="groupsStatus"></p></div>'+
'<div class="card section"><h3>مواد القسم المحدد</h3><p class="muted" id="activeGroupName"></p><div class="row"><input id="newMaterial" placeholder="اسم المادة الجديدة" style="flex:1;min-width:180px;padding:10px;border:1px solid #ccd7eb;border-radius:10px;font:inherit"><button class="soft" id="addMaterial">+ إضافة مادة</button></div><div id="materialsList" class="section"></div><p class="status" id="materialsStatus"></p></div>';
function esc(v){return String(v??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
function drawBasicGrades(){
$('#basicGradesList').innerHTML=basicGrades.map((g,i)=>'<div class="saved"><div class="row"><b style="flex:1">'+esc(g.name)+'</b><span class="muted">باقات فقط</span><label><input type="checkbox" data-basic-visible="'+i+'" '+(g.visible?'checked':'')+'> ظاهر في الموقع</label></div><label class="field"><span>اسم الصف</span><input data-basic-name="'+i+'" value="'+esc(g.name)+'"></label></div>').join('');
}
function drawGroups(){
$('#studyGroups').innerHTML=groups.map((g,i)=>'<div class="saved" style="'+(i===activeGroup?'border:2px solid #102a72;background:#f7f9ff':'')+'"><div class="row"><button class="primary" data-open-group="'+i+'">إدارة المواد</button><b style="flex:1">'+(i+1)+'. '+esc(g.name)+'</b><button class="soft" data-group-up="'+i+'" '+(i===0?'disabled':'')+'>↑</button><button class="soft" data-group-down="'+i+'" '+(i===groups.length-1?'disabled':'')+'>↓</button><button class="danger" data-group-delete="'+i+'">حذف</button></div><label class="field"><span>اسم القسم</span><input data-group-name="'+i+'" value="'+esc(g.name)+'"></label><label><input type="checkbox" data-group-visible="'+i+'" '+(g.visible?'checked':'')+'> إظهار هذا القسم في الموقع</label><div class="muted" style="margin-top:7px">عدد المواد: '+((g.materials||[]).length)+'</div></div>').join('');
$('#activeGroupName').textContent=groups[activeGroup]?'القسم المحدد: '+groups[activeGroup].name:'لا يوجد قسم محدد';
}
function drawMaterials(){
const g=groups[activeGroup];$('#activeGroupName').textContent=g?'القسم المحدد: '+g.name:'لا يوجد قسم محدد';
$('#materialsList').innerHTML=!g?'<p class="muted">أضيفي قسمًا أولًا.</p>':(g.materials||[]).map((m,i)=>'<div class="saved"><div class="row"><b style="flex:1">المادة '+(i+1)+'</b><button class="soft" data-material-up="'+i+'" '+(i===0?'disabled':'')+'>↑</button><button class="soft" data-material-down="'+i+'" '+(i===g.materials.length-1?'disabled':'')+'>↓</button><button class="danger" data-material-delete="'+i+'">حذف</button></div><label class="field"><span>اسم المادة</span><input data-material-name="'+i+'" value="'+esc(m)+'"></label></div>').join('')||'<p class="muted">لا توجد مواد مضافة لهذا القسم بعد. أضيفي المواد الصحيحة من خلال الخانة أعلاه.</p>';
}
drawBasicGrades();drawGroups();drawMaterials();
$('#basicGradesList').onchange=e=>{const v=e.target.dataset.basicVisible;if(v!==undefined)basicGrades[Number(v)].visible=e.target.checked;const n=e.target.dataset.basicName;if(n!==undefined)basicGrades[Number(n)].name=e.target.value.trim()};
$('#saveBasicGrades').onclick=()=>{basicGrades=basicGrades.map((g,i)=>({name:$('#basicGradesList [data-basic-name="'+i+'"]').value.trim()||'صف بدون اسم',visible:$('#basicGradesList [data-basic-visible="'+i+'"]').checked}));localStorage.setItem('demoCmsBasicGrades',JSON.stringify(basicGrades));drawBasicGrades();$('#basicGradesStatus').textContent='تم حفظ الصفوف من الأول إلى العاشر محليًا في المعاينة فقط.'};
$('#addStudyGroup').onclick=()=>{groups.push({name:'قسم توجيهي جديد',visible:true,materials:[]});activeGroup=groups.length-1;drawGroups();drawMaterials();$('#groupsStatus').textContent='أضيف قسم جديد؛ عدّلي اسمه ثم اضغطي حفظ.'};
$('#studyGroups').onclick=e=>{
const t=e.target;let i;
if(t.dataset.openGroup!==undefined){activeGroup=Number(t.dataset.openGroup);drawGroups();drawMaterials();return}
if(t.dataset.groupDelete!==undefined){i=Number(t.dataset.groupDelete);if(!confirm('هل تريدين حذف هذا القسم ومواده من المعاينة؟'))return;groups.splice(i,1);activeGroup=Math.max(0,Math.min(activeGroup,groups.length-1));drawGroups();drawMaterials();return}
if(t.dataset.groupUp!==undefined){i=Number(t.dataset.groupUp);[groups[i-1],groups[i]]=[groups[i],groups[i-1]];activeGroup=i-1;drawGroups();drawMaterials();return}
if(t.dataset.groupDown!==undefined){i=Number(t.dataset.groupDown);[groups[i+1],groups[i]]=[groups[i],groups[i+1]];activeGroup=i+1;drawGroups();drawMaterials()}
};
$('#studyGroups').onchange=e=>{
const i=e.target.dataset.groupVisible;if(i!==undefined){groups[Number(i)].visible=e.target.checked;return}
const n=e.target.dataset.groupName;if(n!==undefined){groups[Number(n)].name=e.target.value;$('#activeGroupName').textContent='القسم المحدد: '+groups[activeGroup].name}
};
$('#addMaterial').onclick=()=>{if(!groups[activeGroup]){alert('اختاري قسمًا أولًا.');return}const v=$('#newMaterial').value.trim();if(!v){alert('اكتبي اسم المادة أولًا.');return}groups[activeGroup].materials.push(v);$('#newMaterial').value='';drawGroups();drawMaterials();$('#materialsStatus').textContent='أضيفت المادة؛ اضغطي حفظ الأقسام والمواد.'};
$('#materialsList').onchange=e=>{const i=e.target.dataset.materialName;if(i!==undefined)groups[activeGroup].materials[Number(i)]=e.target.value.trim()};
$('#materialsList').onclick=e=>{
const t=e.target;let i;if(t.dataset.materialDelete!==undefined){i=Number(t.dataset.materialDelete);groups[activeGroup].materials.splice(i,1);drawGroups();drawMaterials();return}
if(t.dataset.materialUp!==undefined){i=Number(t.dataset.materialUp);const a=groups[activeGroup].materials;[a[i-1],a[i]]=[a[i],a[i-1]];drawGroups();drawMaterials();return}
if(t.dataset.materialDown!==undefined){i=Number(t.dataset.materialDown);const a=groups[activeGroup].materials;[a[i+1],a[i]]=[a[i],a[i+1]];drawGroups();drawMaterials()}
};
$('#saveGroups').onclick=()=>{
groups=groups.map((g,i)=>({name:$('#studyGroups [data-group-name="'+i+'"]').value.trim()||'قسم بدون اسم',visible:$('#studyGroups [data-group-visible="'+i+'"]').checked,materials:(g.materials||[]).map((m,j)=>{const el=$('#materialsList [data-material-name="'+j+'"]');return el?el.value.trim():m}).filter(Boolean)}));
localStorage.setItem('demoCmsStudyGroups',JSON.stringify(groups));drawGroups();drawMaterials();$('#groupsStatus').textContent='تم حفظ الأقسام والمواد محليًا في المعاينة فقط. لم يتغير الموقع الرسمي.';
};
}
if(p==='orders'||p==='exams'||p==='stats'){let data={orders:['الطلبات','#1024 — أحمد محمد — 8.5 د.أ — جديد','#1023 — سارة علي — 4.5 د.أ — تم التواصل'],exams:['الامتحانات','رياضيات — الصف الأول','لغة عربية — الصف الثاني'],stats:['الإحصاءات','إجمالي الزوار: 1,240','زوار اليوم: 38']}[p];c.innerHTML='<div class="title"><h2>'+data[0]+'</h2><p class="muted">بيانات تجريبية للعرض فقط.</p></div><div class="card">'+data.slice(1).map(x=>'<div class="saved">'+x+'</div>').join('')+'</div>'}
if(p==='settings'){
let s=JSON.parse(localStorage.getItem('demoCmsSettings')||'null')||{siteName:'امتحان النجاح',phone:'',whatsapp:'',whatsappChannel:'',color:'#102a72',textColor:'#ffffff',backgroundColor:'#f4f7fc',fontSize:16,fontFamily:'Tahoma',showPhone:true,showWhatsapp:true,showWhatsappChannel:true,barcode:''};
s={siteName:'امتحان النجاح',phone:'',whatsapp:'',whatsappChannel:'',color:'#102a72',textColor:'#ffffff',backgroundColor:'#f4f7fc',fontSize:16,fontFamily:'Tahoma',showPhone:true,showWhatsapp:true,showWhatsappChannel:true,barcode:'',...s};

ption value="12">صغير جدًا (12)</option><option value="14">صغير (14)</option><option value="16">متوسط (16)</option><option value="18">كبير (18)</option><option value="20">كبير جدًا (20)</option><option value="22">أكبر (22)</option><option value="24">كبير جدًا (24)</option></select></label><label class="field"><span>نوع الخط</span><select id="settingFontFamily"><option value="Tahoma">Tahoma</option><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option><option value="Courier New">Courier New</option><option value="system-ui">System UI</option></select></label></div><p class="muted">تظهر التغييرات مباشرة في المعاينة أدناه قبل الحفظ.</p><div class="row section"><button class="primary" id="saveDesignSettings">حفظ الألوان والخطوط</button></div></div><div class="card section"><h3>إدارة الباركود</h3><p class="muted">ارفعي صورة الباركود من الهاتف، أو احذفيه واستبدليه، ثم احفظي الإعدادات.</p><label class="field"><span>اختيار صورة الباركود</span><input id="settingBarcodeFile" type="file" accept="image/*"></label><div id="barcodePreview" class="section"></div><div class="row section"><button class="danger" id="removeBarcode">حذف الباركود</button></div><p class="muted">الحد الأقصى لحجم الصورة في هذه المعاينة 1.5 ميجابايت.</p></div><div class="card section"><h3>معاينة الإعدادات</h3><div id="settingsPreview" class="hero"><h2 id="previewName"></h2><p id="previewPhone"></p><p id="previewWhatsapp"></p><p id="previewChannel"></p><div id="previewBarcode"></div></div></div>';
$('#settingName').value=s.siteName;$('#settingPhone').value=s.phone;$('#settingWhatsapp').value=s.whatsapp;$('#settingWhatsappChannel').value=s.whatsappChannel||'';$('#settingColor').value=s.color;$('#settingTextColor').value=s.textColor;$('#settingBackgroundColor').value=s.backgroundColor;$('#settingFontSize').value=String(s.fontSize);$('#settingFontFamily').value=s.fontFamily;$('#showPhone').checked=s.showPhone;$('#showWhatsapp').checked=s.showWhatsapp;$('#showWhatsappChannel').checked=s.showWhatsappChannel!==false;

function showBarcode(){const box=$('#barcodePreview');box.innerHTML=barcode?'<img alt="معاينة الباركود" src="'+barcode+'" style="max-width:100%;max-height:240px;object-fit:contain;border-radius:12px;border:1px solid #dfe7f5;padding:8px;background:#fff">':'<div class="hint">لا يوجد باركود مضاف حاليًا.</div>';$('#previewBarcode').innerHTML=barcode?'<img alt="الباركود في المعاينة" src="'+barcode+'" style="max-width:180px;max-height:180px;object-fit:contain;background:white;padding:8px;border-radius:10px">':''}
function previewSettings(){const color=$('#settingColor').value,textColor=$('#settingTextColor').value,bg=$('#settingBackgroundColor').value,size=$('#settingFontSize').value,font=$('#settingFontFamily').value;const box=$('#settingsPreview');box.style.background=bg;box.style.color=textColor;box.style.fontSize=size+'px';box.style.fontFamily=font;box.style.borderTop='8px solid '+color;$('#previewName').textContent=$('#settingName').value||'اسم الموقع';$('#previewName').style.color=color;$('#previewPhone').textContent=$('#showPhone').checked&&$('#settingPhone').value.trim()?'رقم التواصل: '+$('#settingPhone').value.trim():'';$('#previewWhatsapp').textContent=$('#showWhatsapp').checked&&$('#settingWhatsapp').value.trim()?'واتساب: '+$('#settingWhatsapp').value.trim():'';$('#previewChannel').textContent=$('#showWhatsappChannel').checked&&$('#settingWhatsappChannel').value.trim()?'قناة واتساب: '+$('#settingWhatsappChannel').value.trim():''}
showBarcode();
$('#settingBarcodeFile').onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('يرجى اختيار ملف صورة.');e.target.value='';return}if(file.size>1500000){alert('حجم صورة الباركود في المعاينة يجب ألا يتجاوز 1.5 ميجابايت.');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{barcode=reader.result;showBarcode();$('#settingsStatus').textContent='تم اختيار الباركود الجديد. اضغطي حفظ الإعدادات لتخزينه في المعاينة.'};reader.readAsDataURL(file)};
$('#removeBarcode').onclick=()=>{barcode='';$('#settingBarcodeFile').value='';showBarcode();$('#settingsStatus').textContent='تم حذف الباركود من المعاينة؛ اضغطي حفظ الإعدادات لتأكيد الحذف.'};
['settingName','settingPhone','settingWhatsapp','settingWhatsappChannel','settingColor','settingTextColor','settingBackgroundColor','settingFontSize','settingFontFamily','showPhone','showWhatsapp','showWhatsappChannel'].forEach(id=>$('#'+id).addEventListener('input',previewSettings));previewSettings();
$('#saveDesignSettings').onclick=()=>$('#saveSettings').click();
$('#saveSettings').onclick=()=>{s={siteName:$('#settingName').value.trim()||'امتحان النجاح',phone:$('#settingPhone').value.trim(),whatsapp:$('#settingWhatsapp').value.trim(),whatsappChannel:$('#settingWhatsappChannel').value.trim(),color:$('#settingColor').value,textColor:$('#settingTextColor').value,backgroundColor:$('#settingBackgroundColor').value,fontSize:Number($('#settingFontSize').value),fontFamily:$('#settingFontFamily').value,showPhone:$('#showPhone').checked,showWhatsapp:$('#showWhatsapp').checked,showWhatsappChannel:$('#showWhatsappChannel').checked,barcode};localStorage.setItem('demoCmsSettings',JSON.stringify(s));$('#settingsStatus').textContent='تم حفظ الإعدادات والتصميم والباركود محليًا في المعاينة فقط. لم يتغير الموقع الرسمي.'};
$('#resetSettings').onclick=()=>{if(!confirm('استعادة الإعدادات الافتراضية لهذه المعاينة؟'))return;localStorage.removeItem('demoCmsSettings');render('settings')};
}

function editor(c){c.innerHTML='<div class="title"><h2>محرر الموقع الكامل</h2><p class="muted">اختاري عنصرًا من المعاينة، ثم عدّلي النص أو أخفيه واحفظي التغيير كمسودة تجريبية.</p></div><div class="notice"><b>وضع المعاينة الآمن:</b> لا يوجد نشر حقيقي ولا اتصال بالموقع الرسمي. أزرار النشر والحذف النهائي معطّلة.</div><div class="cms"><div class="site" id="site"><div class="muted">معاينة مبسطة للصفحة العامة</div><div class="hero"><h2 class="pickable" data-key="hero">'+title+'</h2><p class="pickable" data-key="desc">تدرب، اختبر نفسك، واعرف مستواك من خلال منصة تعليمية سهلة.</p><button class="pickable" data-key="button">ابدأ الآن</button></div><h3 class="pickable" data-key="packages">باقات امتحان النجاح</h3><div class="row"><div class="saved">العادية — 3.5 د.أ</div><div class="saved">التوفير — 4.5 د.أ</div><div class="saved">السوبر — 5.5 د.أ</div></div><p class="pickable" data-key="footer">امتحان النجاح — طريقك للتفوق</p></div><div class="card panel"><h3>تعديل العنصر المحدد</h3><div class="hint" id="hint">اضغطي زر «اختيار عنصر»، ثم اختاري النص من المعاينة.</div><button class="primary section" id="pick">اختيار عنصر من المعاينة</button><label class="field"><span>النص</span><textarea id="edit" rows="3" disabled></textarea></label><label class="field"><input id="visible" type="checkbox" checked disabled> العنصر ظاهر</label><div class="row"><button class="primary" id="save" disabled>حفظ كمسودة</button><button class="soft" id="cancel">إلغاء التحديد</button></div><div class="section"><h4>التعديلات المحفوظة</h4><div id="saved"></div></div><div class="row section"><button class="soft" disabled>نشر المسودة (غير متاح)</button><button class="danger" disabled>حذف المسودة (غير متاح)</button></div></div></div>';
let picking=false;const site=$('#site');$('#pick').onclick=()=>{picking=!picking;site.classList.toggle('pickmode',picking);$('#pick').textContent=picking?'اختاري عنصرًا من المعاينة':'اختيار عنصر من المعاينة'};
site.onclick=e=>{if(!picking)return;let el=e.target.closest('[data-key]');if(!el)return;e.preventDefault();selected=el;$('#edit').disabled=false;$('#save').disabled=false;$('#visible').disabled=false;$('#edit').value=el.textContent.trim();$('#visible').checked=el.style.display!=='none';$('#hint').textContent='العنصر المحدد: '+el.dataset.key;picking=false;site.classList.remove('pickmode');$('#pick').textContent='اختيار عنصر من المعاينة'};
$('#save').onclick=()=>{if(!selected)return;let v={key:selected.dataset.key,text:$('#edit').value,visible:$('#visible').checked};selected.textContent=v.text;selected.style.display=v.visible?'':'none';items=items.filter(x=>x.key!==v.key);items.push(v);localStorage.setItem('demoCmsItems',JSON.stringify(items));drawSaved();$('#hint').textContent='تم حفظ المسودة محليًا لهذه المعاينة فقط.'};
$('#cancel').onclick=()=>{selected=null;$('#edit').value='';$('#edit').disabled=true;$('#save').disabled=true;$('#visible').disabled=true;$('#hint').textContent='لم يتم اختيار عنصر.'};
function drawSaved(){$('#saved').innerHTML=items.map(x=>'<div class="saved"><b>'+x.key+'</b><br>'+x.text+'<br><span class="muted">'+(x.visible?'ظاهر':'مخفي')+'</span></div>').join('')||'<span class="muted">لا توجد تعديلات محفوظة.</span>'}drawSaved()}
