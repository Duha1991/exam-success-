name: Admin demo preview (publishing disabled)

on:
  push:
    branches:
      - admin-cms-development
    paths:
      - 'admin-demo.html'
      - '.github/workflows/admin-demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-demo-files:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm demo files are preserved
        run: echo "Admin demo files are preserved. Publishing to GitHub Pages is disabled; the official website remains the published site."
