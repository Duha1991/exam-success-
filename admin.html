<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>امتحان النجاح – لوحة الإدارة</title><style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f9ff;color:#17213a}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.card{background:#fff;border:1px solid #dfe7f5;border-radius:20px;padding:22px;box-shadow:0 10px 30px #102a7214}.login .card{width:min(400px,90%);text-align:center}.logo{width:65px;height:65px;border-radius:18px;background:#102a72;color:#fff;display:grid;place-items:center;margin:auto;font-size:30px}.field{display:block;text-align:right;margin:18px 0}.field span{display:block;font-weight:bold;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #ccd7eb;border-radius:12px;box-sizing:border-box}.primary{width:100%;padding:13px;border:0;border-radius:12px;background:#102a72;color:#fff;font-weight:bold}.error{color:#d94b4b;margin-top:10px}.top{background:#fff;border-bottom:1px solid #dfe7f5;padding:12px 16px;position:sticky;top:0;z-index:5}.topin,.layout{max-width:1200px;margin:auto}.topin{display:flex;justify-content:space-between;align-items:center}.brand{color:#102a72;font-weight:900}.logout,.nav button,.tag{padding:10px 13px;border:0;border-radius:11px;font-weight:bold}.logout{background:#eef2f8;color:#102a72}.layout{padding:18px;display:grid;grid-template-columns:220px 1fr;gap:18px}.nav{background:#fff;border:1px solid #dfe7f5;border-radius:18px;padding:8px;height:max-content}.nav button{width:100%;background:transparent;text-align:right;margin-bottom:4px}.nav button.active{background:#102a72;color:#fff}.title h2{color:#102a72;margin:4px 0}.title p,.muted{color:#71809b}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.big{font-size:30px;font-weight:900}.section{margin-top:15px}.notice{background:#fff8d9;border:1px solid #efdf91;border-radius:14px;padding:13px;margin-bottom:14px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px;border:1px solid #dfe7f5;border-radius:14px;margin-bottom:9px}.tag{background:#eef3ff;color:#102a72}.empty{text-align:center;padding:30px;color:#71809b}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:11px;border-bottom:1px solid #dfe7f5;text-align:right}.table th{background:#f2f6fd;color:#102a72}@media(max-width:800px){.layout{display:block;padding:12px}.nav{display:flex;overflow:auto;gap:5px;margin-bottom:12px}.nav button{white-space:nowrap;width:auto}.cards{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}</style></head><body><div id="login" class="login"><div class="card"><div class="logo">✓</div><h1 style="color:#102a72">امتحان النجاح</h1><p class="muted">دخول لوحة الإدارة</p><label class="field"><span>كلمة مرور الإدارة</span><input id="key" type="password"></label><button class="primary" id="loginBtn">دخول لوحة التحكم</button><div id="loginError" class="error hidden">بيانات الدخول غير صحيحة.</div></div></div><div id="app" class="hidden"><header class="top"><div class="topin"><div class="brand">امتحان النجاح – لوحة الإدارة</div><button class="logout" id="logout">تسجيل الخروج</button></div></header><div class="layout"><nav class="nav" id="nav"><button class="active" data-page="home">الرئيسية</button><button data-page="content">المحتوى والصور ✏️</button><button data-page="sections">أقسام الموقع ↕️</button><button data-page="orders">الطلبات 📦</button><button data-page="exams">الامتحانات 📚</button><button data-page="stats">الإحصاءات وزوار الموقع 📊</button><button data-page="settings">الإعدادات ⚙️</button></nav><main id="content"></main></div></div><script>const API_BASE='https://exam-success-api.onrender.com';let key=sessionStorage.getItem('exam_admin_key')||'';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':key,'Content-Type':'application/json'};const r=await fetch(API_BASE+path,opt);if(r.status===401)throw Error('AUTH');if(!r.ok)throw Error('ERR');return r.json()}function show(){if(key){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render('home')}else{$('#login').classList.remove('hidden');$('#app').classList.add('hidden')}}async function verify(){try{await api('/api/orders');show()}catch{key='';sessionStorage.removeItem('exam_admin_key');show()}}$('#loginBtn').onclick=async()=>{key=$('#key').value.trim();if(!key)return;try{await api('/api/orders');sessionStorage.setItem('exam_admin_key',key);$('#loginError').classList.add('hidden');show()}catch{key='';$('#loginError').classList.remove('hidden')}};$('#logout').onclick=()=>{key='';sessionStorage.removeItem('exam_admin_key');show()};$('#nav').onclick=e=>{let b=e.target.closest('button[data-page]');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.page)};async function render(p){let c=$('#content');if(p==='home'){c.innerHTML='<div class="title"><h2>الرئيسية</h2><p>لوحة إدارة امتحان النجاح.</p></div><div class="cards"><div class="card"><h3>الطلبات</h3><div class="big" id="oc">…</div><p class="muted">إجمالي الطلبات</p></div><div class="card"><h3>زوار الموقع</h3><div class="big">📊</div><p class="muted">الإحصاءات من القائمة</p></div><div class="card"><h3>المحتوى</h3><div class="big">✏️</div><p class="muted">المحتوى والصور</p></div></div>';try{$('#oc').textContent=(await api('/api/orders')).length}catch{}return}if(p==='content'){c.innerHTML='<div class="title"><h2>المحتوى والصور ✏️</h2></div><div class="card" id="box">جاري التحميل…</div>';try{let d=await fetch(API_BASE+'/api/site-content').then(r=>r.json()),x=d.content||{};$('#box').innerHTML='<h3>الواجهة الرئيسية</h3><div class="item"><b>العنوان الرئيسي</b><span class="muted">'+esc(x.heroTitle||'طريقك إلى النجاح يبدأ من هنا 🎯')+'</span></div><div class="item"><b>الوصف</b><span class="muted">'+esc(x.heroDescription||'تدرب، اختبر نفسك، واعرف مستواك من خلال منصة تعليمية سهلة للطلاب والمعلمين.')+'</span></div>'}catch{$('#box').textContent='تعذر تحميل المحتوى.'}return}if(p==='sections'){c.innerHTML='<div class="title"><h2>أقسام الموقع ↕️</h2><p>ترتيب وإظهار الأقسام.</p></div><div class="notice">سيتم ربط الحفظ بقاعدة البيانات في مرحلة ربط الأقسام.</div><div class="item"><b>الرئيسية</b><span class="tag">ظاهر</span></div><div class="item"><b>لماذا امتحان النجاح؟</b><span class="tag">ظاهر</span></div>';return}if(p==='orders'){c.innerHTML='<div class="title"><h2>الطلبات 📦</h2></div><div class="card" id="ob">جاري التحميل…</div>';try{let a=await api('/api/orders');if(!a.length){$('#ob').innerHTML='<div class="empty">لا توجد طلبات حالياً.</div>';return}$('#ob').innerHTML='<div class="tablewrap"><table class="table"><tr><th>الطلب</th><th>الاسم</th><th>الهاتف</th><th>المجموع</th><th>الحالة</th></tr>'+a.map(o=>'<tr><td>'+esc(o.order_code)+'</td><td>'+esc(o.customer_name)+'</td><td>'+esc(o.phone)+'</td><td>'+esc(o.total)+' د.أ</td><td>'+esc(o.status)+'</td></tr>').join('')+'</table></div>'}catch{$('#ob').innerHTML='<div class="empty">تعذر تحميل الطلبات.</div>'}return}if(p==='exams'){c.innerHTML='<div class="title"><h2>الامتحانات 📚</h2></div><div class="card"><h3>إدارة الامتحانات</h3><p class="muted">القسم جاهز للربط بقاعدة بيانات الامتحانات.</p></div>';return}if(p==='stats'){c.innerHTML='<div class="title"><h2>الإحصاءات وزوار الموقع 📊</h2><p>متابعة حركة زوار الموقع.</p></div><div class="notice"><b>العداد الحقيقي يحتاج ربط الموقع نفسه بتسجيل الزيارات.</b><br>لن نضع أرقاماً وهمية.</div><div class="cards"><div class="card"><h3>إجمالي الزوار</h3><div class="big">—</div><p class="muted">بانتظار تفعيل التتبع</p></div><div class="card"><h3>زوار اليوم</h3><div class="big">—</div><p class="muted">بانتظار تفعيل التتبع</p></div><div class="card"><h3>زوار هذا الشهر</h3><div class="big">—</div><p class="muted">بانتظار تفعيل التتبع</p></div></div><div class="section card"><h3>📈 حركة الزوار</h3><div class="empty">سيظهر الرسم البياني بعد تفعيل تسجيل الزيارات.</div></div>';return}if(p==='settings'){c.innerHTML='<div class="title"><h2>الإعدادات ⚙️</h2></div><div class="card"><h3>الأمان</h3><p class="muted">تغيير كلمة المرور يحتاج ربطاً خادمياً آمناً.</p></div>'}}verify();</script></body></html>
