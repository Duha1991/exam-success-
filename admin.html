<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>امتحان النجاح – لوحة الإدارة</title>
<style>
:root{--blue:#102a72;--blue2:#183b95;--sky:#eef5ff;--yellow:#ffd84d;--green:#19a974;--red:#d94b4b;--text:#17213a;--muted:#71809b;--white:#fff;--line:#dfe7f5;--shadow:0 12px 30px rgba(16,42,114,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#f5f9ff,#fff);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow);text-align:center}.logo{width:72px;height:72px;border-radius:20px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:34px;margin:0 auto 14px}.login-card h1{margin:0 0 8px;color:var(--blue)}.login-card p{color:var(--muted);margin:0 0 22px}.field{display:block;text-align:right;margin-bottom:14px;font-weight:700}.field span{display:block;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #ccd7eb;border-radius:14px;outline:0}.field input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #e5edff}.primary{width:100%;padding:14px 18px;border-radius:14px;background:var(--blue);color:#fff;font-weight:800}.error{color:var(--red);margin-top:12px;font-weight:700}
.app{min-height:100vh}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px}.top-inner{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand .logo{width:46px;height:46px;border-radius:14px;font-size:23px;margin:0}.brand strong{color:var(--blue)}.logout{background:#f3f6fb;color:var(--blue);padding:10px 13px;border-radius:12px;font-weight:800}
.layout{max-width:1200px;margin:auto;padding:18px;display:grid;grid-template-columns:220px 1fr;gap:18px}.nav{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;height:max-content;position:sticky;top:84px;box-shadow:var(--shadow)}.nav button{width:100%;background:transparent;text-align:right;padding:13px;border-radius:12px;color:var(--text);font-weight:800;margin-bottom:4px}.nav button.active{background:var(--blue);color:#fff}.content{min-width:0}.page-title{margin:4px 0 16px}.page-title h2{margin:0;color:var(--blue)}.page-title p{margin:6px 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.card h3{margin:0 0 8px;color:var(--blue)}.big{font-size:30px;font-weight:900}.muted{color:var(--muted)}.section{margin-top:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.mini{padding:10px 13px;border-radius:11px;background:var(--sky);color:var(--blue);font-weight:800}.save{background:var(--green);color:#fff}.danger{background:#fff0f0;color:var(--red)}.notice{background:#fff9df;border:1px solid #f1df8b;border-radius:15px;padding:13px;margin-bottom:14px}.list{display:grid;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff}.item .actions{display:flex;gap:7px;flex-wrap:wrap}.item button{padding:8px 10px;border-radius:10px;background:#eef3ff;color:var(--blue);font-weight:800}.item button.delete{background:#fff0f0;color:var(--red)}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:right}.table th{background:#f4f7fd;color:var(--blue)}.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:800px){.layout{display:block;padding:12px}.nav{position:static;display:flex;overflow:auto;gap:7px;margin-bottom:14px}.nav button{white-space:nowrap;width:auto;margin:0}.cards{grid-template-columns:1fr}.top{padding:11px 12px}.brand strong{font-size:14px}.content{padding-bottom:25px}.item{align-items:flex-start;flex-direction:column}.item .actions{width:100%}.item .actions button{flex:1}.login-card{padding:22px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">✓</div>
    <h1>امتحان النجاح</h1>
    <p>دخول لوحة الإدارة</p>
    <label class="field"><span>كلمة مرور الإدارة</span><input id="key" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور"></label>
    <button class="primary" id="loginBtn">دخول لوحة التحكم</button>
    <div id="loginError" class="error hidden">بيانات الدخول غير صحيحة.</div>
  </div>
</div>
<div id="app" class="app hidden">
  <header class="top"><div class="top-inner"><div class="brand"><div class="logo">✓</div><strong>امتحان النجاح – لوحة الإدارة</strong></div><button class="logout" id="logout">تسجيل الخروج</button></div></header>
  <div class="layout">
    <nav class="nav" id="nav">
      <button class="active" data-page="home">الرئيسية</button>
      <button data-page="content">المحتوى والصور ✏️</button>
      <button data-page="sections">أقسام الموقع ↕️</button>
      <button data-page="orders">الطلبات 📦</button>
      <button data-page="exams">الامتحانات 📚</button>
      <button data-page="settings">الإعدادات ⚙️</button>
    </nav>
    <main class="content" id="content"></main>
  </div>
</div>
<script>
const API='';
let adminKey=sessionStorage.getItem('exam_admin_key')||'';
const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':adminKey,'Content-Type':'application/json'};const r=await fetch(API+path,opt);if(r.status===401)throw new Error('AUTH');if(!r.ok)throw new Error(await r.text());return r.json();}
async function check(){try{await api('/api/orders');showApp();render('home')}catch(e){if(e.message==='AUTH')showLogin();else showApp(),render('home')}}
function showLogin(){$('#login').classList.remove('hidden');$('#app').classList.add('hidden')}
function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden')}
$('#loginBtn').onclick=async()=>{const k=$('#key').value.trim();if(!k)return;adminKey=k;sessionStorage.setItem('exam_admin_key',k);try{await api('/api/orders');$('#loginError').classList.add('hidden');showApp();render('home')}catch(e){sessionStorage.removeItem('exam_admin_key');adminKey='';$('#loginError').classList.remove('hidden')}};
$('#logout').onclick=()=>{sessionStorage.removeItem('exam_admin_key');adminKey='';showLogin()};
$('#nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.page)};
async function render(page){const c=$('#content');if(page==='home'){c.innerHTML=`<div class="page-title"><h2>الرئيسية</h2><p>لوحة إدارة امتحان النجاح — مرتبة وبسيطة من الهاتف والكمبيوتر.</p></div><div class="cards"><div class="card"><h3>المحتوى والصور</h3><div class="big">✏️</div><p class="muted">تعديل محتوى الواجهة والصورة.</p></div><div class="card"><h3>الطلبات</h3><div class="big" id="orderCount">…</div><p class="muted">آخر الطلبات المسجلة.</p></div><div class="card"><h3>الأقسام</h3><div class="big">↕️</div><p class="muted">ترتيب أقسام الموقع.</p></div></div><div class="section card"><h3>ملاحظة</h3><p class="muted">هذه النسخة تحافظ على الموقع الحالي ولا تغيّر شكل الصفحة الرئيسية.</p></div>`;try{const d=await api('/api/orders');$('#orderCount').textContent=d.length}catch{}return}
if(page==='content'){c.innerHTML=`<div class="page-title"><h2>المحتوى والصور ✏️</h2><p>المحتوى الحالي المحفوظ على الخادم.</p></div><div class="card"><h3>الواجهة الرئيسية</h3><div id="contentBox">جاري التحميل…</div></div>`;try{const d=await fetch('/api/site-content').then(r=>r.json());const x=d.content||{};$('#contentBox').innerHTML=`<div class="notice">يمكن تعديل الصورة من النظام الحالي. حقول النص ستبقى كما هي حتى نربط حفظها بشكل آمن.</div><div class="item"><div><b>العنوان الرئيسي</b><div class="muted">${esc(x.heroTitle||'طريقك إلى النجاح يبدأ من هنا 🎯')}</div></div></div><div class="item"><div><b>الوصف</b><div class="muted">${esc(x.heroDescription||'تدرب، اختبر نفسك، واعرف مستواك من خلال منصة تعليمية سهلة للطلاب والمعلمين.')}</div></div></div>`}catch(e){$('#contentBox').textContent='تعذر تحميل المحتوى حالياً.'}return}
if(page==='sections'){c.innerHTML=`<div class="page-title"><h2>أقسام الموقع ↕️</h2><p>ترتيب الأقسام وإظهارها أو إخفاؤها سيكون من هنا.</p></div><div class="notice">سنسند الحفظ لقاعدة البيانات عند ربط هذا الجزء بالخادم.</div><div class="list"><div class="item"><b>الرئيسية</b><span class="mini">ظاهر</span></div><div class="item"><b>لماذا امتحان النجاح؟</b><span class="mini">ظاهر</span></div><div class="item"><b>الطلبات والامتحانات</b><span class="mini">ظاهر</span></div></div>`;return}
if(page==='orders'){c.innerHTML=`<div class="page-title"><h2>الطلبات 📦</h2><p>إدارة الطلبات وتغيير حالتها.</p></div><div id="ordersBox" class="card">جاري التحميل…</div>`;try{const rows=await api('/api/orders');if(!rows.length){$('#ordersBox').innerHTML='<div class="empty">لا توجد طلبات حالياً.</div>';return}$('#ordersBox').innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>الطلب</th><th>الاسم</th><th>الهاتف</th><th>المجموع</th><th>الحالة</th></tr></thead><tbody>'+rows.map(o=>`<tr><td>${esc(o.order_code)}</td><td>${esc(o.customer_name)}</td><td>${esc(o.phone)}</td><td>${esc(o.total)} د.أ</td><td><select data-id="${o.id}" class="status"><option ${o.status==='جديد'?'selected':''}>جديد</option><option ${o.status==='تم التواصل'?'selected':''}>تم التواصل</option><option ${o.status==='قيد التجهيز'?'selected':''}>قيد التجهيز</option><option ${o.status==='خرج للتوصيل'?'selected':''}>خرج للتوصيل</option><option ${o.status==='تم التسليم'?'selected':''}>تم التسليم</option><option ${o.status==='ملغي'?'selected':''}>ملغي</option></select></td></tr>`).join('')+'</tbody></table></div>';document.querySelectorAll('.status').forEach(s=>s.onchange=async()=>{try{await api('/api/orders/'+s.dataset.id,{method:'PATCH',body:JSON.stringify({status:s.value})})}catch{alert('تعذر حفظ الحالة')}})}catch(e){$('#ordersBox').innerHTML='<div class="empty">تعذر تحميل الطلبات.</div>'}return}
if(page==='exams'){c.innerHTML=`<div class="page-title"><h2>الامتحانات 📚</h2><p>هذا القسم جاهز للربط مع قاعدة بيانات الامتحانات.</p></div><div class="card"><h3>إضافة وإدارة الامتحانات</h3><p class="muted">سيتم هنا إضافة الامتحان وتعديله وحذفه وترتيبه وإخفائه، بدون تغيير شكل الموقع الحالي.</p></div>`;return}
if(page==='settings'){c.innerHTML=`<div class="page-title"><h2>الإعدادات ⚙️</h2><p>إعدادات الإدارة.</p></div><div class="card"><h3>الأمان</h3><p class="muted">تغيير كلمة مرور الإدارة يحتاج ربطاً خادمياً حتى لا تظهر كلمة المرور داخل الصفحة.</p><button class="mini" disabled>تغيير كلمة السر — سيتم تفعيله بالخطوة التالية</button></div>`;return}}
check();
</script>
</body>
</html>
