</style></head><body><div id="login" class="login"><div class="card"><div class="logo">✓</div><h1 style="color:#102a72">امتحان النجاح</h1><p class="muted">دخول لوحة الإدارة</p><label class="field"><span>كلمة مرور الإدارة</span><input id="loginPass" type="password"></label><button class="primary" style="width:100%" id="loginBtn">دخول لوحة التحكم</button><div id="loginErr" class="error hidden">بيانات الدخول غير صحيحة.</div></div></div><div id="app" class="hidden"><header class="top"><div class="topin"><div class="brand">امتحان النجاح – لوحة الإدارة</div><button class="soft" id="logout">تسجيل الخروج</button></div></header><div class="layout"><nav class="nav" id="nav"><button class="active" data-page="home">الرئيسية</button><button data-page="content">المحتوى والصور ✏️</button><button data-page="sections">أقسام الموقع ↕️</button><button data-page="orders">الطلبات 📦</button><button data-page="exams">الامتحانات 📚</button><button data-page="stats">الإحصاءات وزوار الموقع 📊</button><button data-page="siteeditor">محرر الموقع الكامل 🧩</button><button data-page="settings">الإعدادات ⚙️</button></nav><main id="main"></main></div></div><script>const API='https://exam-success-api.onrender.com';let token=sessionStorage.getItem('exam_admin_token')||'';let oldKey=sessionStorage.getItem('exam_admin_key')||'';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers['x-admin-token']=token;else if(oldKey)opt.headers['x-admin-key']=oldKey;const r=await fetch(API+path,opt);if(r.status===401){sessionStorage.removeItem('exam_admin_token');token='';throw Error('AUTH')}if(!r.ok){let t='ERR';try{let j=await r.json();t=j.error||t}catch{}throw Error(t)}return r.json()}async function login(){const p=$('#loginPass').value.trim();if(!p)return;try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});if(!r.ok)throw 0;const j=await r.json();token=j.token;oldKey='';sessionStorage.setItem('exam_admin_token',token);sessionStorage.removeItem('exam_admin_key');showApp()}catch{$('#loginErr').classList.remove('hidden')}}$('#loginBtn').onclick=login;$('#loginPass').onkeydown=e=>{if(e.key==='Enter')login()};function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render('home')}$('#logout').onclick=()=>{token='';oldKey='';sessionStorage.clear();location.reload()};$('#nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.page)};function msg(text,ok=true){return '<div class="'+(ok?'ok':'error')+'">'+esc(text)+'</div>'}
async function render(p){const c=$('#main');if(p==='home')return home(c);if(p==='content')return content(c);if(p==='sections')return sections(c);if(p==='orders')return orders(c);if(p==='exams')return exams(c);if(p==='stats')return stats(c);if(p==='siteeditor')return siteEditor(c);if(p==='settings')return settings(c)}
async function home(c){c.innerHTML='<div class="title"><h2>الرئيسية</h2><p class="muted">إدارة موقع امتحان النجاح من مكان واحد.</p></div><div class="cards"><div class="card"><b>الطلبات</b><div class="big" id="norders">…</div><span class="muted">طلب</span></div><div class="card"><b>الأقسام</b><div class="big" id="nsections">…</div><span class="muted">قسم</span></div><div class="card"><b>الامتحانات</b><div class="big" id="nexams">…</div><span class="muted">امتحان</span></div></div><div class="section card"><h3>تنبيه مهم</h3><p class="muted">التعديلات التي تحفظها هنا تظهر على الموقع العام تلقائياً بعد تحديث الصفحة.</p></div>';try{const[a,b,d]=await Promise.all([api('/api/orders'),api('/api/sections'),api('/api/exams')]);$('#norders').textContent=a.length;$('#nsections').textContent=b.length;$('#nexams').textContent=d.length}catch{}}
async function content(c){c.innerHTML='<div class="title"><h2>المحتوى والصور ✏️</h2><p class="muted">من هنا نجهّز كل النصوص والباقات لتكون قابلة للتعديل من لوحة التحكم.</p></div><div class="card" id="contentBox">جاري التحميل…</div><div class="card section" id="packagesBox">جاري تحميل الباقات…</div>';try{const j=await fetch(API+'/api/site-content').then(r=>r.json()),x=j.content||{},h=x.hero||{};c.querySelector('#contentBox').innerHTML='<div class="grid2"><label class="field"><span>العنوان الرئيسي</span><input id="heroTitle" value="'+esc(h.title||x.heroTitle||'طريقك إلى النجاح يبدأ من هنا 🎯')+'"></label><label class="field"><span>وصف الواجهة</span><textarea id="heroDesc" rows="4">'+esc(h.desc||x.heroDescription||'تدرب، اختبر نفسك، واعرف مستواك من خلال منصة تعليمية سهلة للطلاب والمعلمين.')+'</textarea></label><label class="field"><span>نص زر الواجهة</span><input id="heroButton" value="'+esc(h.button||'')+'"></label><label class="field"><span>عنوان قسم الطلب</span><input id="orderTitle" value="'+esc(h.orderTitle||'طلب امتحانات الشهر الأول')+'"></label><label class="field"><span>ملاحظة التوصيل/السلة</span><textarea id="deliveryNote" rows="3">'+esc(h.deliveryNote||'')+'</textarea></label><label class="field"><span>نص زر تأكيد الطلب</span><input id="confirmBtn" value="'+esc(h.confirmBtn||'')+'"></label><label class="field"><span>عنوان معلومات العميل</span><input id="customerTitle" value="'+esc((x.orderTexts||{}).customerTitle||'معلومات الطلب إلى مندوب التوصيل')+'"></label><label class="field"><span>وصف معلومات العميل</span><input id="customerDesc" value="'+esc((x.orderTexts||{}).customerDesc||'أدخل المعلومات اللازمة لتوصيل طلبك والتواصل معك.')+'"></label><label class="field"><span>نص التوصيل</span><input id="deliveryText" value="'+esc((x.orderTexts||{}).deliveryText||'التوصيل')+'"></label><label class="field"><span>نص الخصم</span><input id="discountText" value="'+esc((x.orderTexts||{}).discountText||'خصم اختيار باقتين أو أكثر')+'"></label><label class="field"><span>نص زر إضافة طلبية</span><input id="moreOrderText" value="'+esc((x.orderTexts||{}).moreOrderText||'هل تريد إضافة طلبية أخرى؟')+'"></label></div><div class="section"><h3>إعدادات الحساب 💰</h3><div class="grid2"><label class="field"><span>رسوم التوصيل بالدينار</span><input id="deliveryFee" type="number" step="0.01" min="0" value="'+esc(Number(x.settings?.deliveryFee??1))+'"></label><label class="field"><span>خصم باقتين أو أكثر بالدينار</span><input id="multiDiscount" type="number" step="0.01" min="0" value="'+esc(Number(x.settings?.multiPackageDiscount??1))+'"></label></div></div><div class="section"><h3>صورة الواجهة</h3><input id="heroFile" type="file" accept="image/*"><div style="margin-top:10px" id="imgArea">'+(x.heroImage?'<img class="preview" src="'+esc(x.heroImage)+'"><br><button class="danger" id="removeImg" style="margin-top:8px">إزالة الصورة</button>':'<span class="muted">لا توجد صورة محفوظة.</span>')+'</div><div id="saveMsg"></div></div>';const save=async()=>{const y=await fetch(API+'/api/site-content').then(r=>r.json()),z=y.content||{};z.hero={...(z.hero||{}),title:$('#heroTitle').value,desc:$('#heroDesc').value,button:$('#heroButton').value,orderTitle:$('#orderTitle').value,deliveryNote:$('#deliveryNote').value,confirmBtn:$('#confirmBtn').value};z.heroTitle=$('#heroTitle').value;z.heroDescription=$('#heroDesc').value;z.orderTexts={...(z.orderTexts||{}),customerTitle:$('#customerTitle').value,customerDesc:$('#customerDesc').value,deliveryText:$('#deliveryText').value,discountText:$('#discountText').value,moreOrderText:$('#moreOrderText').value};z.settings={...(z.settings||{}),deliveryFee:Math.max(0,Number($('#deliveryFee').value)||0),multiPackageDiscount:Math.max(0,Number($('#multiDiscount').value)||0)};await api('/api/site-content',{method:'PUT',body:JSON.stringify({content:z})});$('#saveMsg').innerHTML=msg('تم حفظ النص.');setTimeout(()=>$('#saveMsg').innerHTML='',1500)};$('#heroTitle').onblur=save;$('#heroDesc').onblur=save;$('#heroFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024)return $('#saveMsg').innerHTML=msg('الصورة كبيرة جداً. الحد 3MB.',false);const rd=new FileReader();rd.onload=async()=>{const y=await fetch(API+'/api/site-content').then(r=>r.json()),z=y.content||{};z.hero={...(z.hero||{}),image:rd.result};z.heroImage=rd.result;await api('/api/site-content',{method:'PUT',body:JSON.stringify({content:z})});$('#imgArea').innerHTML='<img class="preview" src="'+esc(rd.result)+'"><br><button class="danger" id="removeImg" style="margin-top:8px">إزالة الصورة</button>';bindRemove();$('#saveMsg').innerHTML=msg('تم حفظ الصورة على الخادم.')};rd.readAsDataURL(f)};function bindRemove(){const b=$('#removeImg');if(!b)return;b.onclick=async()=>{const y=await fetch(API+'/api/site-content').then(r=>r.json()),z=y.content||{};if(z.hero)delete z.hero.image;delete z.heroImage;await api('/api/site-content',{method:'PUT',body:JSON.stringify({content:z})});$('#imgArea').innerHTML='<span class="muted">تمت إزالة الصورة.</span>';}}bindRemove();loadPackages()}catch{$('#contentBox').innerHTML=msg('تعذر تحميل المحتوى.',false)}}
async function loadPackages(){const box=$('#packagesBox');if(!box)return;try{const list=await api('/api/packages');box.innerHTML='<h3>الباقات والأسعار 💰</h3><p class="muted">تعديل الاسم والسعر والوصف من هنا، وتنعكس الأسعار الجديدة على الطلبات الجديدة.</p>'+list.map(x=>'<div class="item" data-pkg="'+esc(x.package_key)+'"><div style="flex:1"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.package_key)+'</div></div><div class="grid2" style="flex:2"><label class="field"><span>اسم الباقة</span><input class="pname" value="'+esc(x.name)+'"></label><label class="field"><span>السعر بالدينار</span><input class="pprice" type="number" step="0.01" min="0" value="'+esc(x.price)+'"></label><label class="field" style="grid-column:1/-1"><span>الوصف</span><textarea class="pdesc" rows="2">'+esc(x.description||'')+'</textarea></label></div><button class="primary psave">حفظ</button></div>').join('');box.querySelectorAll('.psave').forEach(btn=>btn.onclick=async()=>{const item=btn.closest('[data-pkg]');btn.disabled=true;try{await api('/api/packages/'+item.dataset.pkg,{method:'PATCH',body:JSON.stringify({name:item.querySelector('.pname').value,price:item.querySelector('.pprice').value,description:item.querySelector('.pdesc').value})});btn.textContent='تم الحفظ ✓';setTimeout(()=>{btn.textContent='حفظ';btn.disabled=false},1200)}catch(e){btn.disabled=false;alert(e.message)}})}catch(e){box.innerHTML=msg('تعذر تحميل الباقات: '+e.message,false)}}
async function sections(c){c.innerHTML='<div class="title"><h2>أقسام الموقع ↕️</h2><p class="muted">أضف، عدّل، أخفِ أو احذف الأقسام واسحبها لإعادة ترتيبها.</p></div><div class="toolbar"><button class="primary" id="addSec">+ إضافة قسم</button></div><div id="secList"></div>';let list=[];async function load(){list=await api('/api/sections');$('#secList').innerHTML=list.map((s,i)=>'<div class="item" draggable="true" data-id="'+s.id+'"><div><span class="drag">☷</span> <b>'+esc(s.title)+'</b><div class="muted">'+esc(s.slug)+'</div></div><div class="actions"><span class="tag">'+(s.visible?'ظاهر':'مخفي')+'</span><button class="mini" onclick="editSection('+s.id+')">تعديل</button><button class="mini" onclick="toggleSection('+s.id+','+(!s.visible)+')">'+(s.visible?'إخفاء':'إظهار')+'</button><button class="danger" onclick="deleteSection('+s.id+')">حذف</button></div></div>').join('')||'<div class="card empty">لا توجد أقسام.</div>';document.querySelectorAll('#secList .item').forEach(el=>{el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.id);el.ondragover=e=>e.preventDefault();el.ondrop=async e=>{e.preventDefault();const from=e.dataTransfer.getData('text/plain'),to=el.dataset.id;if(from===to)return;const ids=[...document.querySelectorAll('#secList .item')].map(x=>x.dataset.id);ids.splice(ids.indexOf(from),1);ids.splice(ids.indexOf(to),0,from);await api('/api/sections/reorder',{method:'POST',body:JSON.stringify({ids})});load()}})}$('#addSec').onclick=async()=>{const title=prompt('اسم القسم');if(!title)return;await api('/api/sections',{method:'POST',body:JSON.stringify({title})});load()};window.editSection=async id=>{const s=list.find(x=>x.id==id);const title=prompt('اسم القسم',s.title);if(title===null)return;await api('/api/sections/'+id,{method:'PATCH',body:JSON.stringify({title})});load()};window.toggleSection=async(id,v)=>{await api('/api/sections/'+id,{method:'PATCH',body:JSON.stringify({visible:v})});load()};window.deleteSection=async id=>{if(!confirm('حذف القسم؟'))return;await api('/api/sections/'+id,{method:'DELETE'});load()};load()}
async function orders(c){c.innerHTML='<div class="title"><h2>الطلبات 📦</h2></div><div class="toolbar"><button class="primary" id="export">تصدير الطلبات إلى Excel</button><button class="soft" id="refresh">تحديث</button></div><div class="card" id="orderBox">جاري التحميل…</div>';let data=[];async function load(){data=await api('/api/orders');if(!data.length){$('#orderBox').innerHTML='<div class="empty">لا توجد طلبات حالياً.</div>';return}$('#orderBox').innerHTML='<div class="tablewrap"><table class="table"><tr><th>الطلب</th><th>العميل</th><th>الهاتف</th><th>العنوان</th><th>المجموع</th><th>الحالة</th><th>إجراء</th></tr>'+data.map(o=>'<tr><td><b>'+esc(o.order_code)+'</b><br><span class="muted">'+esc(new Date(o.created_at).toLocaleString('ar-JO'))+'</span></td><td>'+esc(o.customer_name)+'</td><td>'+esc(o.phone)+'</td><td>'+esc(o.governorate||'')+'<br>'+esc(o.address)+'</td><td>'+esc(o.total)+' د.أ</td><td><select onchange="statusOrder('+o.id+',this.value)">'+['جديد','تم التواصل','قيد التجهيز','خرج للتوصيل','تم التسليم','ملغي'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><button class="danger" onclick="deleteOrder('+o.id+')">حذف</button></td></tr>').join('')+'</table></div>'}window.statusOrder=async(id,status)=>{await api('/api/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load()};window.deleteOrder=async id=>{if(!confirm('حذف الطلب نهائياً؟'))return;await api('/api/orders/'+id,{method:'DELETE'});load()};$('#refresh').onclick=load;$('#export').onclick=()=>{if(!data.length)return;const headers=['رقم الطلب','الاسم','الهاتف','واتساب','المحافظة','العنوان','الباقة المطلوبة','الصف','المادة','الكمية','سعر الوحدة','المجموع','الحالة','التاريخ'];const rows=data.map((o,idx)=>{const items=Array.isArray(o.items)?o.items:[];return[idx+1,o.customer_name,o.phone,o.whatsapp,o.governorate,o.address,items.map(i=>i.package_name||'').join(' | '),items.map(i=>i.grade||'').join(' | '),items.map(i=>i.subject||'').join(' | '),items.map(i=>i.quantity||1).join(' | '),items.map(i=>i.unit_price??'').join(' | '),o.total,o.status,new Date(o.created_at).toLocaleString('ar-JO')]});const escXml=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');const xml='<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="Phone"><NumberFormat ss:Format="@"/></Style></Styles><Worksheet ss:Name="الطلبات"><Table>'+[headers,...rows].map((r,ri)=>'<Row>'+r.map((v,ci)=>'<Cell'+((ci===2||ci===3)?' ss:StyleID="Phone"':'')+'><Data ss:Type="String">'+escXml(v)+'</Data></Cell>').join('')+'</Row>').join('')+'</Table></Worksheet></Workbook>';const blob=new Blob([xml],{type:'application/vnd.ms-excel'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='طلبات-امتحان-النجاح.xls';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};load()}

async function siteEditor(c){
 c.innerHTML='<div class="title"><h2>محرر الموقع الكامل 🧩</h2><p class="muted">اختاري أي عنصر من المعاينة وعدّلي نصه أو رابطه أو صورته أو اخفيه. الحفظ هنا يذهب إلى قاعدة البيانات وليس إلى GitHub.</p></div>'+

 '<div class="cmsToggle card"><input id="cmsBackupVisible" type="checkbox"><div><b>إظهار خانة رقم الهاتف الاحتياطي</b><div class="muted">اتركيه مغلقًا لإخفاء الخانة من نموذج الطلب وعدم استخدامها.</div></div><button class="primary" id="cmsSaveOrder" style="margin-right:auto">حفظ إعداد الطلب</button></div>'+

 '<div class="card cmsPanel"><h3>العنصر المحدد</h3><div id="cmsEmpty" class="cmsHint">لم يتم اختيار عنصر بعد.</div><div id="cmsEditor" class="hidden">'+

 '<label class="field hidden" id="cmsSrcWrap"><span>رابط الصورة</span><input id="cmsSrc"></label>'+
 '<label class="field hidden" id="cmsPlaceholderWrap"><span>النص داخل الخانة</span><input id="cmsPlaceholder"></label>'+
 '<label class="cmsToggle"><input id="cmsVisible" type="checkbox" checked><span>العنصر ظاهر</span></label>'+
 '<div class="cmsActions"><button class="primary" id="cmsSave">حفظ هذا العنصر</button><button class="danger" id="cmsRemoveOverride">إلغاء التعديل المحفوظ</button></div>'+
 '<div class="cmsBlock"><h4>إضافة نص أو زر بعد هذا العنصر</h4><label class="field"><span>عنوان اختياري</span><input id="cmsBlockTitle"></label><label class="field"><span>النص</span><textarea id="cmsBlockText" rows="3"></textarea></label><label class="field"><span>نص الزر (اختياري)</span><input id="cmsBlockButton"></label><label class="field"><span>رابط الزر</span><input id="cmsBlockHref" placeholder="https://... أو #قسم"></label><button class="soft" id="cmsAddBlock">إضافة بعد العنصر</button></div>'+
 '</div><div class="cmsBlock"><h4>التعديلات المحفوظة</h4><div id="cmsSavedList" class="cmsSavedList"></div></div></div></div>';
 let site={};
 async function loadSite(){
   const r=await fetch(API+'/api/site-content?adminCms='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('تعذر تحميل المحتوى');
   const j=await r.json();site=j.content||{};site.cms=site.cms||{};site.cms.orderForm=site.cms.orderForm||{};site.cms.overrides=Array.isArray(site.cms.overrides)?site.cms.overrides:[];site.cms.blocks=Array.isArray(site.cms.blocks)?site.cms.blocks:[];
   $('#cmsBackupVisible').checked=site.cms.orderForm.backupPhoneVisible===true;renderSaved();
 }
 async function saveSite(){

 }

 $('#cmsSaveOrder').onclick=async()=>{try{site.cms.orderForm.backupPhoneVisible=$('#cmsBackupVisible').checked;await saveSite();setStatus('تم حفظ إعداد نموذج الطلب ✓');reloadFrame()}catch(e){setStatus(e.message,false)}};
 const frame=$('#cmsFrame');let selected=null,pickOn=false;
 function reloadFrame(){frame.src='/?cmsPreview=1&ts='+Date.now()}
 $('#cmsReload').onclick=reloadFrame;
 function cssEsc(v){return String(v).replace(/([^a-zA-Z0-9_-])/g,'\\\\$1')}
 function selectorFor(el,doc){
   if(el.id)return '#'+cssEsc(el.id);
   const parts=[];let n=el;
   while(n&&n.nodeType===1&&n!==doc.body){
     let p=n.tagName.toLowerCase();
     const cls=[...n.classList].filter(x=>/^[a-zA-Z_-][a-zA-Z0-9_-]*$/.test(x)&&!x.startsWith('cms-')).slice(0,2);
     if(cls.length)p+='.'+cls.map(cssEsc).join('.');
     const same=n.parentElement?[...n.parentElement.children].filter(x=>x.tagName===n.tagName):[];
     if(same.length>1)p+=':nth-of-type('+(same.indexOf(n)+1)+')';
     parts.unshift(p);
     try{if(doc.querySelectorAll(parts.join(' > ')).length===1)break}catch(e){}
     n=n.parentElement;
   }
   return parts.join(' > ');
 }
 function bindFrame(){
   try{
     const doc=frame.contentDocument;if(!doc)return;
     doc.addEventListener('click',ev=>{
       if(!pickOn)return;
       ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();

       selected={el,selector:selectorFor(el,doc)};
       pickOn=false;$('#cmsPick').textContent='اختيار عنصر من الموقع';showSelected();
     },true);
     doc.addEventListener('submit',ev=>{if(location.search.includes('cmsPreview'))ev.preventDefault()},true);
   }catch(e){setStatus('تعذر فتح المعاينة.',false)}
 }
 frame.onload=bindFrame;
 $('#cmsPick').onclick=()=>{pickOn=!pickOn;$('#cmsPick').textContent=pickOn?'اضغطي الآن على العنصر…':'اختيار عنصر من الموقع';setStatus(pickOn?'وضع الاختيار مفعّل. اضغطي على العنصر داخل المعاينة.':'تم إلغاء وضع الاختيار.')};
 function showSelected(){
   if(!selected)return;const el=selected.el,tag=el.tagName.toLowerCase(),ov=site.cms.overrides.find(x=>x.selector===selected.selector)||{};
   $('#cmsEmpty').classList.add('hidden');$('#cmsEditor').classList.remove('hidden');$('#cmsSelector').textContent=selected.selector;
   $('#cmsText').value=ov.text!=null?ov.text:((tag==='input'||tag==='textarea'||tag==='select'||tag==='img')?'':el.textContent.trim());
   $('#cmsVisible').checked=ov.visible!==false;
   $('#cmsHrefWrap').classList.toggle('hidden',tag!=='a');$('#cmsHref').value=ov.href!=null?ov.href:(el.getAttribute('href')||'');
   $('#cmsSrcWrap').classList.toggle('hidden',tag!=='img');$('#cmsSrc').value=ov.src!=null?ov.src:(el.getAttribute('src')||'');
   const hasPh=('placeholder' in el);$('#cmsPlaceholderWrap').classList.toggle('hidden',!hasPh);$('#cmsPlaceholder').value=ov.placeholder!=null?ov.placeholder:(hasPh?(el.getAttribute('placeholder')||''):'');
 }
 function currentOverride(){
   const el=selected.el,tag=el.tagName.toLowerCase(),o={selector:selected.selector,visible:$('#cmsVisible').checked};
   if(!['input','textarea','select','img'].includes(tag))o.text=$('#cmsText').value;
   if(tag==='a')o.href=$('#cmsHref').value;
   if(tag==='img')o.src=$('#cmsSrc').value;
   if('placeholder' in el)o.placeholder=$('#cmsPlaceholder').value;
   return o;
 }
 function applyLocal(o){
   try{frame.contentDocument.querySelectorAll(o.selector).forEach(el=>{el.style.display=o.visible===false?'none':'';if(o.text!=null)el.textContent=o.text;if(o.href!=null&&el.tagName==='A')el.setAttribute('href',o.href);if(o.src!=null&&el.tagName==='IMG')el.setAttribute('src',o.src);if(o.placeholder!=null&&'placeholder' in el)el.setAttribute('placeholder',o.placeholder)})}catch(e){}
 }
 $('#cmsSave').onclick=async()=>{if(!selected)return;try{const o=currentOverride(),i=site.cms.overrides.findIndex(x=>x.selector===o.selector);if(i>=0)site.cms.overrides[i]=o;else site.cms.overrides.push(o);await saveSite();applyLocal(o);renderSaved();setStatus('تم حفظ العنصر ✓')}catch(e){setStatus(e.message,false)}};
 $('#cmsRemoveOverride').onclick=async()=>{if(!selected)return;try{site.cms.overrides=site.cms.overrides.filter(x=>x.selector!==selected.selector);await saveSite();renderSaved();reloadFrame();setStatus('تم إلغاء التعديل المحفوظ عن هذا العنصر.')}catch(e){setStatus(e.message,false)}};
 $('#cmsAddBlock').onclick=async()=>{if(!selected)return;const title=$('#cmsBlockTitle').value.trim(),text=$('#cmsBlockText').value.trim(),buttonText=$('#cmsBlockButton').value.trim(),href=$('#cmsBlockHref').value.trim();if(!title&&!text&&!buttonText)return setStatus('اكتبي نصًا أو عنوانًا أو زرًا أولًا.',false);try{site.cms.blocks.push({id:'b'+Date.now(),anchor:selected.selector,position:'afterend',title,text,buttonText,href,visible:true});await saveSite();$('#cmsBlockTitle').value='';$('#cmsBlockText').value='';$('#cmsBlockButton').value='';$('#cmsBlockHref').value='';renderSaved();reloadFrame();setStatus('تمت إضافة العنصر الجديد ✓')}catch(e){setStatus(e.message,false)}};
 function renderSaved(){
   const box=$('#cmsSavedList');if(!box)return;const ovs=site.cms?.overrides||[],bl=site.cms?.blocks||[];
   const items=ovs.map((x,i)=>'<div class="cmsSavedItem"><b>تعديل عنصر</b><br>'+esc(x.selector)+'<div class="actions"><button class="mini cmsJump" data-s="'+esc(x.selector)+'">اختيار</button><button class="danger cmsDelOv" data-i="'+i+'">حذف التعديل</button></div></div>').join('')+
   bl.map((x,i)=>'<div class="cmsSavedItem"><b>عنصر مضاف</b><br>'+esc(x.title||x.text||x.buttonText||'عنصر جديد')+'<div class="actions"><button class="danger cmsDelBl" data-i="'+i+'">حذف</button></div></div>').join('');
   box.innerHTML=items||'<div class="muted">لا توجد تعديلات محفوظة بعد.</div>';
   box.querySelectorAll('.cmsDelOv').forEach(b=>b.onclick=async()=>{site.cms.overrides.splice(Number(b.dataset.i),1);await saveSite();renderSaved();reloadFrame()});
   box.querySelectorAll('.cmsDelBl').forEach(b=>b.onclick=async()=>{site.cms.blocks.splice(Number(b.dataset.i),1);await saveSite();renderSaved();reloadFrame()});
   box.querySelectorAll('.cmsJump').forEach(b=>b.onclick=()=>{try{const el=frame.contentDocument.querySelector(b.dataset.s);if(el){selected={el,selector:b.dataset.s};showSelected();el.scrollIntoView({behavior:'smooth',block:'center'})}}catch(e){}});
 }
 try{await loadSite()}catch(e){setStatus(e.message,false)}
}
