<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>امتحان النجاح – لوحة الإدارة</title><style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f8ff;color:#17213a}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.card{background:#fff;border:1px solid #dfe7f5;border-radius:18px;padding:18px;box-shadow:0 8px 25px #102a7212}.login .card{width:min(410px,90%);text-align:center}.logo{width:64px;height:64px;border-radius:18px;background:#102a72;color:#fff;display:grid;place-items:center;margin:auto;font-size:28px}.field{display:block;text-align:right;margin:12px 0}.field span{display:block;font-weight:bold;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd7eb;border-radius:11px;font:inherit}.primary,.danger,.soft,.mini{border:0;border-radius:10px;padding:10px 13px;font-weight:bold;cursor:pointer}.primary{background:#102a72;color:#fff}.danger{background:#ffe8e8;color:#b3261e}.soft{background:#eef3ff;color:#102a72}.mini{padding:7px 9px;background:#eef3ff;color:#102a72}.error{color:#c62828;margin-top:8px}.ok{color:#147d4b;margin-top:8px}.top{background:#fff;border-bottom:1px solid #dfe7f5;padding:12px 16px;position:sticky;top:0;z-index:5}.topin,.layout{max-width:1250px;margin:auto}.topin{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;color:#102a72}.layout{padding:16px;display:grid;grid-template-columns:225px 1fr;gap:16px}.nav{background:#fff;border:1px solid #dfe7f5;border-radius:16px;padding:8px;height:max-content}.nav button{width:100%;border:0;background:transparent;text-align:right;padding:11px;border-radius:10px;font-weight:bold;cursor:pointer;margin-bottom:3px}.nav button.active{background:#102a72;color:#fff}.title h2{margin:4px 0;color:#102a72}.muted{color:#71809b}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.big{font-size:28px;font-weight:900}.section{margin-top:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.notice{background:#fff8d9;border:1px solid #efdf91;border-radius:12px;padding:12px;margin:10px 0}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid #dfe7f5;border-radius:13px;margin-bottom:8px;background:#fff}.actions{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#eef3ff;color:#102a72;padding:6px 9px;border-radius:9px;font-size:12px;font-weight:bold}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:9px;border-bottom:1px solid #dfe7f5;text-align:right;vertical-align:top}.table th{background:#f1f5fc;color:#102a72}.preview{max-width:240px;max-height:150px;border-radius:12px;border:1px solid #dfe7f5;object-fit:contain}.empty{text-align:center;padding:28px;color:#71809b}.drag{cursor:grab;font-size:20px;color:#71809b}.switch{display:flex;align-items:center;gap:7px}@media(max-width:850px){.layout{display:block;padding:10px}.nav{display:flex;overflow:auto;gap:4px;margin-bottom:10px}.nav button{white-space:nowrap;width:auto}.cards,.grid2{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="login" class="login"><div class="card"><div class="logo">✓</div><h1 style="color:#102a72">امتحان النجاح</h1><p class="muted">دخول لوحة الإدارة</p><label class="field"><span>كلمة مرور الإدارة</span><input id="loginPass" type="password"></label><button class="primary" style="width:100%" id="loginBtn">دخول لوحة التحكم</button><div id="loginErr" class="error hidden">بيانات الدخول غير صحيحة.</div></div></div><div id="app" class="hidden"><header class="top"><div class="topin"><div class="brand">امتحان النجاح – لوحة الإدارة</div><button class="soft" id="logout">تسجيل الخروج</button></div></header><div class="layout"><nav class="nav" id="nav"><button class="active" data-page="home">الرئيسية</button><button data-page="content">المحتوى والصور ✏️</button><button data-page="sections">أقسام الموقع ↕️</button><button data-page="orders">الطلبات 📦</button><button data-page="exams">الامتحانات 📚</button><button data-page="stats">الإحصاءات وزوار الموقع 📊</button><button data-page="settings">الإعدادات ⚙️</button></nav><main id="main"></main></div></div><script>const API='https://exam-success-api.onrender.com';let token=sessionStorage.getItem('exam_admin_token')||'';let oldKey=sessionStorage.getItem('exam_admin_key')||'';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers['x-admin-token']=token;else if(oldKey)opt.headers['x-admin-key']=oldKey;const r=await fetch(API+path,opt);if(r.status===401){sessionStorage.removeItem('exam_admin_token');token='';throw Error('AUTH')}if(!r.ok){let t='ERR';try{let j=await r.json();t=j.error||t}catch{}throw Error(t)}return r.json()}async function login(){const p=$('#loginPass').value.trim();if(!p)return;try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});if(!r.ok)throw 0;const j=await r.json();token=j.token;oldKey='';sessionStorage.setItem('exam_admin_token',token);sessionStorage.removeItem('exam_admin_key');showApp()}catch{$('#loginErr').classList.remove('hidden')}}$('#loginBtn').onclick=login;$('#loginPass').onkeydown=e=>{if(e.key==='Enter')login()};function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render('home')}$('#logout').onclick=()=>{token='';oldKey='';sessionStorage.clear();location.reload()};$('#nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.page)};function msg(text,ok=true){return '<div class="'+(ok?'ok':'error')+'">'+esc(text)+'</div>'}
async function render(p){const c=$('#main');if(p==='home')return home(c);if(p==='content')return content(c);if(p==='sections')return sections(c);if(p==='orders')return orders(c);if(p==='exams')return exams(c);if(p==='stats')return stats(c);if(p==='settings')return settings(c)}
async function home(c){c.innerHTML='<div class="title"><h2>الرئيسية</h2><p class="muted">إدارة موقع امتحان النجاح من مكان واحد.</p></div><div class="cards"><div class="card"><b>الطلبات</b><div class="big" id="norders">…</div><span class="muted">طلب</span></div><div class="card"><b>الأقسام</b><div class="big" id="nsections">…</div><span class="muted">قسم</span></div><div class="card"><b>الامتحانات</b><div class="big" id="nexams">…</div><span class="muted">امتحان</span></div></div><div class="section card"><h3>تنبيه مهم</h3><p class="muted">الموقع العام لا يتم تعديله من هذه اللوحة. التعديلات هنا تخص الإدارة والمحتوى المحفوظ في الخادم.</p></div>';try{const[a,b,d]=await Promise.all([api('/api/orders'),api('/api/sections'),api('/api/exams')]);$('#norders').textContent=a.length;$('#nsections').textContent=b.length;$('#nexams').textContent=d.length}catch{}}
async function content(c){c.innerHTML='<div class="title"><h2>المحتوى والصور ✏️</h2><p class="muted">التعديلات النصية تحفظ تلقائياً عند الخروج من الحقل، والصورة تحفظ مباشرة بعد اختيارها.</p></div><div class="card" id="contentBox">جاري التحميل…</div>';try{const j=await fetch(API+'/api/site-content').then(r=>r.json()),x=j.content||{};c.querySelector('#contentBox').innerHTML='<div class="grid2"><label class="field"><span>العنوان الرئيسي</span><input id="heroTitle" value="'+esc(x.heroTitle||'طريقك إلى النجاح يبدأ من هنا 🎯')+'"></label><label class="field"><span>الوصف</span><textarea id="heroDesc" rows="4">'+esc(x.heroDescription||'تدرب، اختبر نفسك، واعرف مستواك من خلال منصة تعليمية سهلة للطلاب والمعلمين.')+'</textarea></label></div><div class="section"><h3>صورة الواجهة</h3><input id="heroFile" type="file" accept="image/*"><div style="margin-top:10px" id="imgArea">'+(x.heroImage?'<img class="preview" src="'+esc(x.heroImage)+'"><br><button class="danger" id="removeImg" style="margin-top:8px">إزالة الصورة</button>':'<span class="muted">لا توجد صورة محفوظة.</span>')+'</div><div id="saveMsg"></div></div>';const save=async()=>{const y=await fetch(API+'/api/site-content').then(r=>r.json()),z=y.content||{};z.heroTitle=$('#heroTitle').value;z.heroDescription=$('#heroDesc').value;await api('/api/site-content',{method:'PUT',body:JSON.stringify({content:z})});$('#saveMsg').innerHTML=msg('تم حفظ النص.');setTimeout(()=>$('#saveMsg').innerHTML='',1500)};$('#heroTitle').onblur=save;$('#heroDesc').onblur=save;$('#heroFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024)return $('#saveMsg').innerHTML=msg('الصورة كبيرة جداً. الحد 3MB.',false);const rd=new FileReader();rd.onload=async()=>{const y=await fetch(API+'/api/site-content').then(r=>r.json()),z=y.content||{};z.heroImage=rd.result;await api('/api/site-content',{method:'PUT',body:JSON.stringify({content:z})});$('#imgArea').innerHTML='<img class="preview" src="'+esc(rd.result)+'"><br><button class="danger" id="removeImg" style="margin-top:8px">إزالة الصورة</button>';bindRemove();$('#saveMsg').innerHTML=msg('تم حفظ الصورة على الخادم.')};rd.readAsDataURL(f)};function bindRemove(){const b=$('#removeImg');if(!b)return;b.onclick=async()=>{const y=await fetch(API+'/api/site-content').then(r=>r.json()),z=y.content||{};delete z.heroImage;await api('/api/site-content',{method:'PUT',body:JSON.stringify({content:z})});$('#imgArea').innerHTML='<span class="muted">تمت إزالة الصورة.</span>';}}bindRemove()}catch{$('#contentBox').innerHTML=msg('تعذر تحميل المحتوى.',false)}}
async function sections(c){c.innerHTML='<div class="title"><h2>أقسام الموقع ↕️</h2><p class="muted">أضف، عدّل، أخفِ أو احذف الأقسام واسحبها لإعادة ترتيبها.</p></div><div class="toolbar"><button class="primary" id="addSec">+ إضافة قسم</button></div><div id="secList"></div>';let list=[];async function load(){list=await api('/api/sections');$('#secList').innerHTML=list.map((s,i)=>'<div class="item" draggable="true" data-id="'+s.id+'"><div><span class="drag">☷</span> <b>'+esc(s.title)+'</b><div class="muted">'+esc(s.slug)+'</div></div><div class="actions"><span class="tag">'+(s.visible?'ظاهر':'مخفي')+'</span><button class="mini" onclick="editSection('+s.id+')">تعديل</button><button class="mini" onclick="toggleSection('+s.id+','+(!s.visible)+')">'+(s.visible?'إخفاء':'إظهار')+'</button><button class="danger" onclick="deleteSection('+s.id+')">حذف</button></div></div>').join('')||'<div class="card empty">لا توجد أقسام.</div>';document.querySelectorAll('#secList .item').forEach(el=>{el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.id);el.ondragover=e=>e.preventDefault();el.ondrop=async e=>{e.preventDefault();const from=e.dataTransfer.getData('text/plain'),to=el.dataset.id;if(from===to)return;const ids=[...document.querySelectorAll('#secList .item')].map(x=>x.dataset.id);ids.splice(ids.indexOf(from),1);ids.splice(ids.indexOf(to),0,from);await api('/api/sections/reorder',{method:'POST',body:JSON.stringify({ids})});load()}})}$('#addSec').onclick=async()=>{const title=prompt('اسم القسم');if(!title)return;await api('/api/sections',{method:'POST',body:JSON.stringify({title})});load()};window.editSection=async id=>{const s=list.find(x=>x.id==id);const title=prompt('اسم القسم',s.title);if(title===null)return;await api('/api/sections/'+id,{method:'PATCH',body:JSON.stringify({title})});load()};window.toggleSection=async(id,v)=>{await api('/api/sections/'+id,{method:'PATCH',body:JSON.stringify({visible:v})});load()};window.deleteSection=async id=>{if(!confirm('حذف القسم؟'))return;await api('/api/sections/'+id,{method:'DELETE'});load()};load()}
async function orders(c){c.innerHTML='<div class="title"><h2>الطلبات 📦</h2></div><div class="toolbar"><button class="primary" id="export">تصدير الطلبات إلى Excel</button><button class="soft" id="refresh">تحديث</button></div><div class="card" id="orderBox">جاري التحميل…</div>';let data=[];async function load(){data=await api('/api/orders');if(!data.length){$('#orderBox').innerHTML='<div class="empty">لا توجد طلبات حالياً.</div>';return}$('#orderBox').innerHTML='<div class="tablewrap"><table class="table"><tr><th>الطلب</th><th>العميل</th><th>الهاتف</th><th>العنوان</th><th>المجموع</th><th>الحالة</th><th>إجراء</th></tr>'+data.map(o=>'<tr><td><b>'+esc(o.order_code)+'</b><br><span class="muted">'+esc(new Date(o.created_at).toLocaleString('ar-JO'))+'</span></td><td>'+esc(o.customer_name)+'</td><td>'+esc(o.phone)+'</td><td>'+esc(o.governorate||'')+'<br>'+esc(o.address)+'</td><td>'+esc(o.total)+' د.أ</td><td><select onchange="statusOrder('+o.id+',this.value)">'+['جديد','تم التواصل','قيد التجهيز','خرج للتوصيل','تم التسليم','ملغي'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><button class="danger" onclick="deleteOrder('+o.id+')">حذف</button></td></tr>').join('')+'</table></div>'}window.statusOrder=async(id,status)=>{await api('/api/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load()};window.deleteOrder=async id=>{if(!confirm('حذف الطلب نهائياً؟'))return;await api('/api/orders/'+id,{method:'DELETE'});load()};$('#refresh').onclick=load;$('#export').onclick=()=>{if(!data.length)return;const headers=['رقم الطلب','الاسم','الهاتف','واتساب','المحافظة','العنوان','المجموع','الحالة','التاريخ'];const rows=data.map(o=>[o.order_code,o.customer_name,o.phone,o.whatsapp,o.governorate,o.address,o.total,o.status,new Date(o.created_at).toLocaleString('ar-JO')]);const html='<html><meta charset="UTF-8"><table><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table></html>';const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='طلبات-امتحان-النجاح.xls';a.click();URL.revokeObjectURL(url)};load()}
async function exams(c){c.innerHTML='<div class="title"><h2>الامتحانات 📚</h2><p class="muted">إضافة وتعديل وإخفاء وحذف الامتحانات من قاعدة البيانات.</p></div><div class="toolbar"><button class="primary" id="addExam">+ إضافة امتحان</button></div><div id="examList"></div>';let list=[];async function load(){list=await api('/api/exams');$('#examList').innerHTML=list.map(x=>'<div class="item"><div><b>'+esc(x.title)+'</b><div class="muted">الصف: '+esc(x.grade)+' — المادة: '+esc(x.subject)+'</div></div><div class="actions"><span class="tag">'+(x.visible?'ظاهر':'مخفي')+'</span><button class="mini" onclick="editExam('+x.id+')">تعديل</button><button class="mini" onclick="toggleExam('+x.id+','+(!x.visible)+')">'+(x.visible?'إخفاء':'إظهار')+'</button><button class="danger" onclick="deleteExam('+x.id+')">حذف</button></div></div>').join('')||'<div class="card empty">لا توجد امتحانات.</div>'}$('#addExam').onclick=async()=>{const title=prompt('اسم الامتحان');if(!title)return;const grade=prompt('الصف','');const subject=prompt('المادة','');await api('/api/exams',{method:'POST',body:JSON.stringify({title,grade,subject})});load()};window.editExam=async id=>{const x=list.find(e=>e.id==id);const title=prompt('اسم الامتحان',x.title);if(title===null)return;const grade=prompt('الصف',x.grade);const subject=prompt('المادة',x.subject);await api('/api/exams/'+id,{method:'PATCH',body:JSON.stringify({title,grade,subject})});load()};window.toggleExam=async(id,v)=>{await api('/api/exams/'+id,{method:'PATCH',body:JSON.stringify({visible:v})});load()};window.deleteExam=async id=>{if(!confirm('حذف الامتحان؟'))return;await api('/api/exams/'+id,{method:'DELETE'});load()};load()}
async function stats(c){c.innerHTML='<div class="title"><h2>الإحصاءات وزوار الموقع 📊</h2><p class="muted">الإحصاءات المسجلة من الموقع.</p></div><div class="cards"><div class="card"><b>إجمالي الزوار المسجلين</b><div class="big" id="st">…</div></div><div class="card"><b>زوار اليوم</b><div class="big" id="td">…</div></div><div class="card"><b>زوار هذا الشهر</b><div class="big" id="mo">…</div></div></div><div class="section card"><h3>آخر 14 يوماً</h3><div id="chart"></div></div>';try{const j=await api('/api/stats');$('#st').textContent=j.total;$('#td').textContent=j.today;$('#mo').textContent=j.month;$('#chart').innerHTML=j.chart.map(x=>'<div style="display:flex;align-items:center;gap:8px;margin:7px 0"><span style="width:90px">'+esc(x.day)+'</span><div style="height:14px;background:#102a72;border-radius:8px;width:'+Math.min(100,Math.max(2,x.count*8))+'%"></div><b>'+x.count+'</b></div>').join('')}catch{$('#chart').innerHTML='<div class="empty">تعذر تحميل الإحصاءات.</div>'}}
function settings(c){c.innerHTML='<div class="title"><h2>الإعدادات ⚙️</h2></div><div class="card" style="max-width:600px"><h3>تغيير كلمة المرور</h3><p class="muted">يمكنك تغيير كلمة مرور الإدارة دون تعديل الموقع العام.</p><label class="field"><span>كلمة المرور الحالية</span><input id="cp1" type="password"></label><label class="field"><span>كلمة المرور الجديدة</span><input id="cp2" type="password"></label><label class="field"><span>تأكيد كلمة المرور الجديدة</span><input id="cp3" type="password"></label><button class="primary" id="cpBtn">حفظ كلمة المرور</button><div id="cpMsg"></div></div>';$(' #cpBtn')?.addEventListener('click',()=>{});$('#cpBtn').onclick=async()=>{const a=$('#cp1').value,b=$('#cp2').value,d=$('#cp3').value;if(b!==d)return $('#cpMsg').innerHTML=msg('كلمتا المرور غير متطابقتين.',false);try{await api('/api/admin/change-password',{method:'POST',body:JSON.stringify({currentPassword:a,newPassword:b})});$('#cpMsg').innerHTML=msg('تم تغيير كلمة المرور بنجاح.');}catch(e){$('#cpMsg').innerHTML=msg(e.message,false)}}}
(async()=>{if(token){try{await api('/api/orders');showApp();}catch{token='';sessionStorage.removeItem('exam_admin_token')}}else if(oldKey){try{await api('/api/orders');showApp();}catch{oldKey='';sessionStorage.removeItem('exam_admin_key')}}})();</script></body></html>
